[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitehole-ghost-horn-observatory"
version = "2.1.0"
description = "Bilingual Streamlit/Plotly toolkit for visualizing academic-paper corpora as Ghost Horn structures, keyword starfields, terrains, and comparative maps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "White Hole Project Contributors" }]
keywords = [
  "bibliometrics",
  "knowledge-visualization",
  "streamlit",
  "plotly",
  "academic-papers",
  "keyword-extraction",
  "white-hole",
  "ghost-horn"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Text Processing :: Linguistic"
]
dependencies = [
  "streamlit>=1.28",
  "plotly>=5.18",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "jieba>=0.42",
  "PyMuPDF>=1.23",
  "python-docx>=1.0",
  "reportlab>=4.0"
]

[project.optional-dependencies]
desktop = ["PyQt6>=6.5", "PyQt6-WebEngine>=6.5"]
dev = ["ruff>=0.5", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/your-username/whitehole-ghost-horn-observatory"
Repository = "https://github.com/your-username/whitehole-ghost-horn-observatory"
Issues = "https://github.com/your-username/whitehole-ghost-horn-observatory/issues"

[project.scripts]
whitehole = "launcher:main"

[tool.setuptools]
py-modules = ["constants", "launcher", "main", "plot_functions", "streamlit_app", "utils"]
packages = ["plot"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["icon.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"
